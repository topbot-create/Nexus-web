  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 45%, rgba(0, 191, 255, 0.12), transparent 28%),
        radial-gradient(circle at 15% 20%, rgba(0, 120, 255, 0.08), transparent 25%),
        radial-gradient(circle at 85% 80%, rgba(0, 191, 255, 0.07), transparent 25%),
        #03050a;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      position: relative;
    }

    /* Space / stars */
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      opacity: 0.75;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.85) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(0,191,255,.7) 1px, transparent 1.5px);
      background-size: 83px 97px, 137px 151px;
      background-position: 10px 20px, 45px 70px;
    }

    body::after {
      background:
        linear-gradient(120deg, transparent 0 48%, rgba(0,191,255,.035) 50%, transparent 52%),
        linear-gradient(300deg, transparent 0 48%, rgba(0,191,255,.025) 50%, transparent 52%);
      background-size: 520px 520px;
    }

    .container {
      position: relative;
      z-index: 2;
      width: min(1100px, 92vw);
      text-align: center;
      padding: 40px 20px;
    }

    .brand {
      font-size: clamp(18px, 2.5vw, 28px);
      font-weight: 700;
      letter-spacing: 7px;
      color: #00bfff;
      text-shadow:
        0 0 8px rgba(0,191,255,.9),
        0 0 24px rgba(0,191,255,.5);
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(70px, 14vw, 190px);
      line-height: .88;
      letter-spacing: -7px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      text-shadow:
        0 0 8px rgba(255,255,255,.8),
        0 0 24px rgba(0,191,255,.9),
        0 0 65px rgba(0,120,255,.65);
    }

    .subtitle {
      margin-top: 28px;
      font-size: clamp(15px, 2vw, 22px);
      letter-spacing: 5px;
      color: #8fdfff;
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(0,191,255,.55);
    }

    .description {
      max-width: 720px;
      margin: 22px auto 0;
      color: rgba(220, 245, 255, .78);
      font-size: 15px;
      line-height: 1.7;
    }

    .discord-card {
      width: min(520px, 92vw);
      margin: 30px auto 0;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      text-decoration: none;
      color: #fff;
      border: 1px solid rgba(0, 191, 255, .35);
      border-radius: 15px;
      background: rgba(5, 14, 24, .72);
      box-shadow:
        0 0 24px rgba(0, 191, 255, .10),
        inset 0 0 20px rgba(0, 191, 255, .035);
      backdrop-filter: blur(10px);
      transition: .2s ease;
    }

    .discord-card:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 191, 255, .8);
      box-shadow:
        0 0 30px rgba(0, 191, 255, .22),
        inset 0 0 20px rgba(0, 191, 255, .06);
    }

    .server-avatar {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(0, 191, 255, .7);
      box-shadow: 0 0 16px rgba(0, 191, 255, .28);
      background: #05070d;
    }

    .discord-info {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .discord-name {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .2px;
    }

    .discord-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      color: rgba(205, 235, 245, .62);
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #23a55a;
      box-shadow: 0 0 8px rgba(35, 165, 90, .65);
    }

    .discord-arrow {
      color: #00bfff;
      font-size: 22px;
      line-height: 1;
      opacity: .8;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 34px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 165px;
      padding: 14px 24px;
      border: 1px solid rgba(0,191,255,.75);
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 1px;
      background: rgba(0, 40, 70, .35);
      box-shadow:
        0 0 15px rgba(0,191,255,.16),
        inset 0 0 15px rgba(0,191,255,.05);
      transition: .2s ease;
      backdrop-filter: blur(6px);
    }

    .btn:hover {
      transform: translateY(-2px);
      border-color: #00bfff;
      background: rgba(0, 120, 190, .25);
      box-shadow:
        0 0 25px rgba(0,191,255,.35),
        inset 0 0 20px rgba(0,191,255,.08);
    }

    .btn.primary {
      background: #00aeea;
      color: #001018;
      border-color: #55d8ff;
      box-shadow:
        0 0 25px rgba(0,191,255,.35),
        0 0 55px rgba(0,191,255,.15);
    }

    .btn.primary:hover {
      background: #31c9ff;
    }

    footer {
      margin-top: 42px;
      color: rgba(180, 220, 235, .5);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      body {
        overflow: auto;
      }

      .container {
        padding: 50px 16px;
      }

      h1 {
        letter-spacing: -3px;
      }

      .subtitle {
        letter-spacing: 3px;
      }

      .description {
        font-size: 14px;
      }

      .discord-card {
        width: min(360px, 92vw);
      }

      .actions {
        flex-direction: column;
        align-items: center;
      }

      .btn {
        width: min(300px, 90vw);
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">NEXUS SECURITY</div>

    <h1>ANTI NUKE</h1>

    <div class="subtitle">Discord Security</div>

    <p class="description">
      Nexus is a Discord security bot focused on Anti-Nuke protection,
      server security, anti-raid and automated defense.
    </p>

    <!-- Discord server preview -->
    <a
      class="discord-card"
      href="https://discord.gg/a9NEaNt4As"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Join the Nexus Security Discord server"
    >
      <img
        id="server-avatar"
        class="server-avatar"
        alt="Nexus Security server avatar"
        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='32' fill='%2305070d'/%3E%3Cpath d='M64 16 103 31v30c0 24-16 40-39 49C41 101 25 85 25 61V31z' fill='none' stroke='%2300bfff' stroke-width='8'/%3E%3Cpath d='M44 62 57 75 84 47' fill='none' stroke='%2300bfff' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
      >

      <span class="discord-info">
        <span class="discord-name">Nexus Security</span>
        <span class="discord-meta">
          <span class="status-dot"></span>
          <span id="server-members">Discord Community</span>
        </span>
      </span>

      <span class="discord-arrow">↗</span>
    </a>

    <div class="actions">
      <a
        class="btn primary"
        href="https://discord.gg/a9NEaNt4As"
        target="_blank"
        rel="noopener noreferrer"
      >
        JOIN DISCORD
      </a>

      <a
        class="btn"
        href="https://github.com/topbot-create"
        target="_blank"
        rel="noopener noreferrer"
      >
        GITHUB
      </a>
    </div>

    <footer>
      NEXUS SECURITY • OFFICIAL COMMUNITY
    </footer>
  </main>

  <script>
    (async () => {
      const inviteCode = "a9NEaNt4As";
      const avatar = document.getElementById("server-avatar");
      const members = document.getElementById("server-members");

      try {
        const response = await fetch(
          `https://discord.com/api/v10/invites/${inviteCode}?with_counts=true`,
          { headers: { "Accept": "application/json" } }
        );

        if (!response.ok) return;

        const data = await response.json();
        const guild = data.guild;

        if (!guild) return;

        // Discord CDN server icon:
        // /icons/{guild_id}/{icon_hash}.png
        if (guild.id && guild.icon) {
          avatar.src =
            `https://cdn.discordapp.com/icons/${guild.id}/${guild.icon}.png?size=128`;
        }

        if (typeof data.approximate_member_count === "number") {
          members.textContent =
            `${data.approximate_member_count.toLocaleString()} members`;
        } else {
          members.textContent = "Discord Community";
        }
      } catch (error) {
        // Fallback SVG avatar remains visible if Discord API is unavailable.
        console.warn("Nexus Discord preview unavailable:", error);
      }
    })();
  </script>

</body>
</html>
